name: pacegasus
description: Pacegasus running coach app (UI mock, no backend yet).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.0
  flutter_dotenv: ^5.1.0
  sphere_maps_flutter: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
